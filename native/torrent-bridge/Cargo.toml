[package]
name = "streamio-x-torrent-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "streamio_torrent_bridge"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
axum = { version = "0.8.8", default-features = false, features = ["http1", "tokio", "query"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
enginefs = { path = "../stream-server/enginefs", default-features = false, features = ["librqbit"] }
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7.17", features = ["io"] }
url = "2.5"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
